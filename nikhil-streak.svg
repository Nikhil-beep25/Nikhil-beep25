<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 195" width="500" height="195" role="img" aria-label="Nikhil Bhadauriya's GitHub Streak">
<defs>
  <style><![CDATA[
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseRing { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.04); opacity: 1; } }
    @keyframes shineX { 0% { transform: translateX(-160px) skewX(-15deg); } 60%, 100% { transform: translateX(560px) skewX(-15deg); } }
    @keyframes flameFlicker { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-2px) scale(1.08); } }
    .row { opacity: 0; animation: fadeSlide 0.6s cubic-bezier(0.2, 0.8, 0.3, 1) forwards; }
    .ring { transform-origin: 250px 75px; animation: pulseRing 3s ease-in-out infinite; }
    .sh { animation: shineX 4.5s ease-in-out 2.4s infinite; }
    .flame { transform-origin: 250px 42px; animation: flameFlicker 2s ease-in-out infinite; }
  ]]></style>

  <!-- Linear Animated Border Gradient matching nikhil-stats and nikhil-langs -->
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"><animate attributeName="stop-color" values="#38bdf8;#7dd3fc;#38bdf8" dur="6s" repeatCount="indefinite"/></stop>
    <stop offset="100%"><animate attributeName="stop-color" values="#7dd3fc;#38bdf8;#7dd3fc" dur="6s" repeatCount="indefinite"/></stop>
  </linearGradient>

  <!-- Circular Streak Ring Gradient -->
  <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="50%" stop-color="#0ea5e9"/>
    <stop offset="100%" stop-color="#0284c7"/>
  </linearGradient>

  <!-- Number Accent Gradients -->
  <linearGradient id="numGrad1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#7dd3fc"/>
  </linearGradient>
  <linearGradient id="numGrad2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#60a5fa"/>
  </linearGradient>

  <!-- Card Clip & Inner Shimmer -->
  <clipPath id="cardClip">
    <rect x="1" y="1" width="498" height="193" rx="14"/>
  </clipPath>
  <linearGradient id="shg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#fff" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Card Outer Background & Animated Border -->
<rect x="1" y="1" width="498" height="193" rx="14" fill="#0c192e" stroke="url(#tg)" stroke-width="1.5"/>

<!-- Shimmer Glow Effect -->
<g clip-path="url(#cardClip)">
  <rect class="sh" x="0" y="0" width="100" height="195" fill="url(#shg)"/>
</g>

<!-- Dividers -->
<line x1="165" y1="35" x2="165" y2="160" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="335" y1="35" x2="335" y2="160" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3 3"/>

<!-- Left Column: Total Contributions -->
<g class="row" style="animation-delay: 0.2s">
  <text x="82" y="76" text-anchor="middle" font-size="34" font-weight="bold" fill="url(#numGrad1)">50+</text>
  <text x="82" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">Total Contributions</text>
  <text x="82" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#7dd3fc">Continuous Growth</text>
</g>

<!-- Center Column: Current Streak -->
<g class="row" style="animation-delay: 0.4s">
  <!-- Glowing Streak Ring -->
  <g class="ring">
    <circle cx="250" cy="78" r="42" fill="none" stroke="#162a45" stroke-width="5"/>
    <circle cx="250" cy="78" r="42" fill="none" stroke="url(#ringGrad)" stroke-width="5" stroke-linecap="round" stroke-dasharray="210" stroke-dashoffset="35"/>
  </g>
  
  <!-- Fire Icon Badge -->
  <g class="flame">
    <circle cx="250" cy="36" r="14" fill="#0c192e" stroke="#38bdf8" stroke-width="1.2"/>
    <path d="M250 28 C252 32, 255 34, 255 38 C255 42, 252 44, 250 44 C248 44, 245 42, 245 38 C245 35, 247 33, 250 28 Z" fill="#38bdf8"/>
    <path d="M250 33 C251 35, 253 37, 253 39 C253 41, 251 43, 250 43 C249 43, 247 41, 247 39 C247 37, 249 35, 250 33 Z" fill="#7dd3fc"/>
  </g>

  <!-- Current Streak Value -->
  <text x="250" y="88" text-anchor="middle" font-size="28" font-weight="bold" fill="#38bdf8">1</text>
  
  <!-- Labels -->
  <text x="250" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#38bdf8">Current Streak</text>
  <text x="250" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#7dd3fc">Daily Committer</text>
</g>

<!-- Right Column: Longest Streak -->
<g class="row" style="animation-delay: 0.6s">
  <text x="418" y="76" text-anchor="middle" font-size="34" font-weight="bold" fill="url(#numGrad2)">5+</text>
  <text x="418" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#e6edf3">Longest Streak</text>
  <text x="418" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#7dd3fc">Consistent Builder</text>
</g>
</svg>
