<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Personal Portfolio Project">
  <title>Personal Portfolio</title>
  <defs>
    <style><![CDATA[
      text { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes shine { 0% { transform: translateX(-600px) skewX(-15deg); } 60%,100% { transform: translateX(600px) skewX(-15deg); } }
      @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }
      .shine { animation: shine 5.5s ease-in-out infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
    ]]></style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c192e"/>
      <stop offset="100%" stop-color="#08101e"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shineG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="596" height="296" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="598" height="298" rx="15" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>
  <rect x="0" y="0" width="600" height="300" fill="url(#glow)"/>

  <g clip-path="url(#cardClip)">
    <!-- Decorative Grid / Shapes -->
    <g opacity="0.06" stroke="#c084fc" stroke-width="1">
      <line x1="0" y1="50" x2="600" y2="50"/>
      <line x1="0" y1="100" x2="600" y2="100"/>
      <line x1="0" y1="150" x2="600" y2="150"/>
      <line x1="0" y1="200" x2="600" y2="200"/>
      <line x1="0" y1="250" x2="600" y2="250"/>
      <line x1="100" y1="0" x2="100" y2="300"/>
      <line x1="200" y1="0" x2="200" y2="300"/>
      <line x1="300" y1="0" x2="300" y2="300"/>
      <line x1="400" y1="0" x2="400" y2="300"/>
      <line x1="500" y1="0" x2="500" y2="300"/>
    </g>

    <!-- Header Tag -->
    <rect x="36" y="32" width="165" height="24" rx="12" fill="#c084fc" fill-opacity="0.2" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1"/>
    <text x="118" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="1">DEVELOPER PORTFOLIO</text>

    <!-- Title -->
    <text x="36" y="92" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="0.5">Personal Portfolio</text>

    <!-- Description -->
    <text x="36" y="124" font-size="13" font-weight="400" fill="#94a3b8">A modern developer portfolio showcasing skills, projects,</text>
    <text x="36" y="144" font-size="13" font-weight="400" fill="#94a3b8">experience, and contact information with smooth animations,</text>
    <text x="36" y="164" font-size="13" font-weight="400" fill="#94a3b8">responsive layout, and seamless dark &amp; light mode support.</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(36, 195)">
      <!-- React -->
      <rect x="0" y="0" width="62" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="31" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">React</text>
      <!-- TypeScript -->
      <rect x="70" y="0" width="86" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="113" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">TypeScript</text>
      <!-- Tailwind CSS -->
      <rect x="164" y="0" width="94" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="211" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">Tailwind CSS</text>
      <!-- Framer Motion -->
      <rect x="266" y="0" width="104" height="24" rx="6" fill="#1e293b" stroke="#e879f9" stroke-opacity="0.3"/>
      <text x="318" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#e879f9">Framer Motion</text>
      <!-- Vite -->
      <rect x="378" y="0" width="50" height="24" rx="6" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.3"/>
      <text x="403" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#a855f7">Vite</text>
    </g>

    <!-- Key Highlights / Badges -->
    <g transform="translate(36, 245)">
      <circle cx="6" cy="6" r="4" fill="#c084fc" class="pulse"/>
      <text x="18" y="10" font-size="12" font-weight="600" fill="#e2e8f0">Smooth Animations</text>

      <circle cx="160" cy="6" r="4" fill="#c084fc" class="pulse"/>
      <text x="172" y="10" font-size="12" font-weight="600" fill="#e2e8f0">Responsive Design</text>

      <circle cx="300" cy="6" r="4" fill="#c084fc" class="pulse"/>
      <text x="312" y="10" font-size="12" font-weight="600" fill="#e2e8f0">Dark / Light Mode</text>
    </g>

    <!-- Animated Shine -->
    <rect class="shine" x="0" y="0" width="200" height="300" fill="url(#shineG)"/>
  </g>
</svg>
