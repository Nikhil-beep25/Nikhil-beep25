<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="VidyaSanchar School ERP">
  <title>VidyaSanchar – School ERP</title>
  <defs>
    <style><![CDATA[
      text { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes shine { 0% { transform: translateX(-600px) skewX(-15deg); } 60%,100% { transform: translateX(600px) skewX(-15deg); } }
      @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }
      .shine { animation: shine 5s ease-in-out infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
    ]]></style>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c192e"/>
      <stop offset="100%" stop-color="#08101e"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shineG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="2" y="2" width="596" height="296" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="598" height="298" rx="15" fill="url(#bg)" stroke="url(#border)" stroke-width="2"/>
  <rect x="0" y="0" width="600" height="300" fill="url(#glow)"/>

  <g clip-path="url(#cardClip)">
    <!-- Decorative Grid / Shapes -->
    <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
      <line x1="0" y1="50" x2="600" y2="50"/>
      <line x1="0" y1="100" x2="600" y2="100"/>
      <line x1="0" y1="150" x2="600" y2="150"/>
      <line x1="0" y1="200" x2="600" y2="200"/>
      <line x1="0" y1="250" x2="600" y2="250"/>
      <line x1="100" y1="0" x2="100" y2="300"/>
      <line x1="200" y1="0" x2="200" y2="300"/>
      <line x1="300" y1="0" x2="300" y2="300"/>
      <line x1="400" y1="0" x2="400" y2="300"/>
      <line x1="500" y1="0" x2="500" y2="300"/>
    </g>

    <!-- Header Tag -->
    <rect x="36" y="32" width="130" height="24" rx="12" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="101" y="48" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1">SCHOOL ERP</text>

    <!-- Title -->
    <text x="36" y="92" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="0.5">VidyaSanchar</text>

    <!-- Description -->
    <text x="36" y="124" font-size="13" font-weight="400" fill="#94a3b8">A modern School ERP prototype to simplify school operations.</text>
    <text x="36" y="144" font-size="13" font-weight="400" fill="#94a3b8">Features auth, student &amp; teacher management, attendance,</text>
    <text x="36" y="164" font-size="13" font-weight="400" fill="#94a3b8">fee tracking, interactive dashboard, and admin controls.</text>

    <!-- Tech Stack Pills -->
    <g transform="translate(36, 195)">
      <!-- React -->
      <rect x="0" y="0" width="62" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="31" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">React</text>
      <!-- TypeScript -->
      <rect x="70" y="0" width="86" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="113" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">TypeScript</text>
      <!-- Node.js -->
      <rect x="164" y="0" width="70" height="24" rx="6" fill="#1e293b" stroke="#4ade80" stroke-opacity="0.3"/>
      <text x="199" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#4ade80">Node.js</text>
      <!-- Express -->
      <rect x="242" y="0" width="78" height="24" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-opacity="0.3"/>
      <text x="281" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#cbd5e1">Express.js</text>
      <!-- PostgreSQL -->
      <rect x="328" y="0" width="88" height="24" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-opacity="0.3"/>
      <text x="372" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#60a5fa">PostgreSQL</text>
      <!-- Prisma -->
      <rect x="424" y="0" width="66" height="24" rx="6" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.3"/>
      <text x="457" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#c084fc">Prisma</text>
      <!-- Tailwind -->
      <rect x="498" y="0" width="68" height="24" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="532" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#38bdf8">Tailwind</text>
    </g>

    <!-- Key Highlights / Badges -->
    <g transform="translate(36, 245)">
      <circle cx="6" cy="6" r="4" fill="#38bdf8" class="pulse"/>
      <text x="18" y="10" font-size="12" font-weight="600" fill="#e2e8f0">Auth &amp; RBAC</text>

      <circle cx="120" cy="6" r="4" fill="#38bdf8" class="pulse"/>
      <text x="132" y="10" font-size="12" font-weight="600" fill="#e2e8f0">Student &amp; Teacher Portal</text>

      <circle cx="290" cy="6" r="4" fill="#38bdf8" class="pulse"/>
      <text x="302" y="10" font-size="12" font-weight="600" fill="#e2e8f0">Attendance &amp; Fees</text>

      <circle cx="440" cy="6" r="4" fill="#38bdf8" class="pulse"/>
      <text x="452" y="10" font-size="12" font-weight="600" fill="#e2e8f0">Admin Panel</text>
    </g>

    <!-- Animated Shine -->
    <rect class="shine" x="0" y="0" width="200" height="300" fill="url(#shineG)"/>
  </g>
</svg>
